<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>加密聊天室</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 700px;
      margin: 0 auto;
    }
    .header {
      background: #075e54;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
    }
    .header h3 { flex: 1; font-weight: 500; font-size: 1.1rem; }
    .link-btn, .exit-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 8px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
    }
    .msg-row {
      display: flex;
      margin-bottom: 8px;
    }
    .msg-row.right { justify-content: flex-end; }
    .bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-word;
      background: white;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
    .msg-row.right .bubble {
      background: #dcf8c6;
    }
    .media-content {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 4px;
      cursor: pointer;
      display: block;
    }
    .system-msg {
      text-align: center;
      color: #888;
      font-size: 0.8rem;
      margin: 5px 0;
    }
    .toolbar {
      background: white;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #ddd;
    }
    #textInput {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 20px;
      background: #f0f0f0;
    }
    .send-btn, .file-btn {
      background: #075e54;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .invite-bar {
      background: #fff3e0;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #e65100;
      text-align: center;
      word-break: break-all;
      display: none;
    }
    .invite-bar.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h3>🔐 加密聊天</h3>
    <button class="link-btn" onclick="showInviteLink()" title="复制邀请链接">🔗</button>
    <button class="exit-btn" onclick="exitRoom()" title="退出">✕</button>
  </div>

  <div class="invite-bar" id="inviteBar"></div>

  <div class="messages" id="messages"></div>

  <div class="toolbar">
    <button class="file-btn" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="text" id="textInput" placeholder="输入消息…" autofocus />
    <button class="send-btn" onclick="sendText()">➤</button>
    <input type="file" id="fileInput" accept="image/*,video/*" onchange="sendFile()" hidden />
  </div>

  <script>
    // ========== 房间信息初始化 ==========
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    let keyHex = urlParams.get('key');

    // 若无房间参数，创建新房间（房主模式）
    if (!roomId || !keyHex) {
      roomId = Math.random().toString(36).substring(2, 10);
      const keyBytes = new Uint8Array(32);
      crypto.getRandomValues(keyBytes);
      keyHex = Array.from(keyBytes).map(b => b.toString(16).padStart(2, '0')).join('');
      const newUrl = `${location.origin}${location.pathname}?room=${roomId}&key=${keyHex}`;
      window.history.replaceState({}, '', newUrl);
    }

    const inviteUrl = `${location.origin}${location.pathname}?room=${roomId}&key=${keyHex}`;
    const messagesDiv = document.getElementById('messages');
    const textInput = document.getElementById('textInput');
    const inviteBar = document.getElementById('inviteBar');

    let ws;

    // ========== WebSocket 连接 ==========
    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}?room=${roomId}`);

      ws.onmessage = async (event) => {
        try {
          const data = JSON.parse(event.data);

          // 系统消息
          if (data.type === 'system') {
            appendSystem(data.text);
            return;
          }

          // 房间销毁指令
          if (data.type === 'destroy') {
            appendSystem(data.text);
            ws.close();
            setTimeout(() => {
              window.location.href = '/destroyed';
            }, 800);
            return;
          }

          // 解密对方消息
          if (data.encrypted) {
            const plain = await decryptMessage(data.encrypted, keyHex);
            const msgObj = JSON.parse(plain);
            displayMessage(msgObj, 'left'); // 对方消息靠左显示
          }
        } catch (err) {
          console.error('处理消息失败:', err);
          appendSystem('收到无法解密的消息');
        }
      };

      ws.onclose = () => {
        appendSystem('连接已断开');
      };

      ws.onerror = () => {
        appendSystem('连接错误');
      };
    }

    // ========== AES-GCM 加解密 ==========
    async function getKey(hex) {
      const raw = hexToBytes(hex);
      return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }

    async function encryptMessage(plaintext, hexKey) {
      const key = await getKey(hexKey);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(plaintext);
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
      const combined = new Uint8Array(iv.byteLength + cipher.byteLength);
      combined.set(new Uint8Array(iv), 0);
      combined.set(new Uint8Array(cipher), iv.byteLength);
      return btoa(String.fromCharCode(...combined));
    }

    async function decryptMessage(combinedBase64, hexKey) {
      const key = await getKey(hexKey);
      const combined = new Uint8Array(Array.from(atob(combinedBase64), c => c.charCodeAt(0)));
      const iv = combined.slice(0, 12);
      const cipher = combined.slice(12);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      return new TextDecoder().decode(decrypted);
    }

    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      return bytes;
    }

    // ========== 发送消息 ==========
    async function sendEncrypted(msgObj) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert('未连接到服务器');
        return;
      }
      const plain = JSON.stringify(msgObj);
      const encrypted = await encryptMessage(plain, keyHex);
      ws.send(JSON.stringify({ encrypted }));
    }

    async function sendText() {
      const text = textInput.value.trim();
      if (!text) return;

      const msgObj = { type: 'text', content: text };
      // 先在右侧显示自己的消息
      displayMessage(msgObj, 'right');
      await sendEncrypted(msgObj);

      // *** 修复：清空输入框 ***
      textInput.value = '';
      // 保持焦点
      textInput.focus();
    }

    async function sendFile() {
      const file = document.getElementById('fileInput').files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64 = e.target.result.split(',')[1];
        const msgObj = {
          type: file.type.startsWith('image/') ? 'image' : 'video',
          mime: file.type,
          content: base64
        };
        // 自己右侧显示
        displayMessage(msgObj, 'right');
        await sendEncrypted(msgObj);
      };
      reader.readAsDataURL(file);
      document.getElementById('fileInput').value = ''; // 允许重复上传同一文件
    }

    // ========== UI 渲染 ==========
    function displayMessage(msgObj, side) {
      const row = document.createElement('div');
      row.className = `msg-row ${side}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (msgObj.type === 'text') {
        bubble.textContent = msgObj.content;
      } else if (msgObj.type === 'image') {
        const img = document.createElement('img');
        img.src = `data:${msgObj.mime};base64,${msgObj.content}`;
        img.className = 'media-content';
        img.onclick = () => window.open(img.src);
        bubble.appendChild(img);
      } else if (msgObj.type === 'video') {
        const video = document.createElement('video');
        video.src = `data:${msgObj.mime};base64,${msgObj.content}`;
        video.className = 'media-content';
        video.controls = true;
        bubble.appendChild(video);
      }

      row.appendChild(bubble);
      messagesDiv.appendChild(row);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function appendSystem(text) {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ========== 附加操作 ==========
    function showInviteLink() {
      inviteBar.innerHTML = `邀请链接（复制发给对方）：<br><b>${inviteUrl}</b>`;
      inviteBar.classList.toggle('show');
      // 自动复制到剪贴板
      navigator.clipboard?.writeText(inviteUrl).catch(() => {});
    }

    function exitRoom() {
      if (ws) ws.close();
      window.location.replace(location.origin + location.pathname);
    }

    // 回车发送
    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendText();
    });

    // 开始连接
    connect();
  </script>
</body>
</html>
